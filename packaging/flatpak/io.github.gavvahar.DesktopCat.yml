app-id: io.github.gavvahar.DesktopCat
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
command: desktop-cat

# freedesktop (not org.kde.Platform) is deliberate: PySide6's wheels bundle
# their own copy of Qt, so there's nothing to gain from a Qt-flavored
# runtime -- it would just mean two copies of Qt on disk.
#
# --socket=x11 (not just --socket=fallback-x11) is needed for pynput's
# global keyboard/mouse listening to work at all -- it uses Xlib's
# XRecord/XTest extensions, which need real X11 access, not the more
# restricted access Wayland-native apps get. Under pure Wayland (no XWayland
# X11 access granted), those reactions will fail to start and print a
# warning, same graceful-disable behavior as everywhere else in this app --
# see the plan's own "hard parts" note on Wayland restricting global input.
#
# --filesystem grants match this app's actual (non-portal) file I/O:
# config.py reads/writes ~/.config/desktopcat/config.json directly, and
# autostart.py writes ~/.config/autostart/desktopcat.desktop directly. A
# stricter Flatpak citizen would use the Background portal for autostart
# instead of writing to autostart/ directly -- not implemented here, since
# it would mean deviating from how autostart.py already works on non-Flatpak
# Linux. Worth revisiting before an actual Flathub submission.
finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --filesystem=xdg-config/desktopcat:create
  - --filesystem=xdg-config/autostart:create

modules:
  - name: python3-desktopcat-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --find-links=. --prefix=${FLATPAK_DEST}
        pyside6 pynput
    sources:
      # PySide6 + its own split-out packages (wheels bundle Qt itself, so
      # no source build needed -- manylinux x86_64 only, matching this
      # app's other packaging targets, which are all x86_64).
      - type: file
        url: https://files.pythonhosted.org/packages/d8/de/af89d71410c83b10654d86ff9aff2a4f87c30163658f1cc145242e222526/pyside6-6.11.1-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: b1fc521ba2bb5109425ab8add06bddbdd524abcad06cfa012cc39a22a189feb2
      - type: file
        url: https://files.pythonhosted.org/packages/c7/9b/e0355d8897b5c150770f1d95718aad17d432fcc9c035c04f3f58427d4693/shiboken6-6.11.1-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 9a8bccfafc8805254cabcfa1edfaf55cd52889f4998c91ad0d9a4433fb1bcdbe
      - type: file
        url: https://files.pythonhosted.org/packages/5c/49/0e1237c4400bec7e335d2c4eeb49bc40d9fd88a9ac44ca9083ce1abdc308/pyside6_essentials-6.11.1-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: e3ef7027b41e4e55fadb56e3b3257dc8ee92154b639fe67fc4c8e05e9d976c60
      - type: file
        url: https://files.pythonhosted.org/packages/dd/62/fb1428a523b2a4541e232aab50d9e789e6b4526f37fd9593452a7ea5b6b3/pyside6_addons-6.11.1-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 8e6c65fbd73a512d6f72cda8d8277444a85a34dc99dd1dae9c21d35b8671bb1f
      # pynput + its Linux dependencies. evdev is a source build (needs
      # linux/input.h); untested whether org.freedesktop.Sdk provides that
      # header -- if the CI build fails here, that's the first thing to
      # check (see packaging/appimage's build.sh comment about this same
      # dependency needing build-essential + linux-libc-dev elsewhere).
      - type: file
        url: https://files.pythonhosted.org/packages/6d/98/bbeb760852adb27f166ce1617f0e51aabb15f21b1e60ea703f2aed3c78ac/pynput-1.8.2-py2.py3-none-any.whl
        sha256: 8cc38cf13a6ab2749cb375678be8a0fd705d7ce49c8001ff5db4007a723bbef1
      - type: file
        url: https://files.pythonhosted.org/packages/fc/b8/ff33610932e0ee81ae7f1269c890f697d56ff74b9f5b2ee5d9b7fa2c5355/python_xlib-0.33-py2.py3-none-any.whl
        sha256: c3534038d42e0df2f1392a1b30a15a4ff5fdc2b86cfa94f072bf11b10a164398
      - type: file
        url: https://files.pythonhosted.org/packages/b7/ce/149a00dd41f10bc29e5921b496af8b574d8413afcd5e30dfa0ed46c2cc5e/six-1.17.0-py2.py3-none-any.whl
        sha256: 4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274
      - type: file
        url: https://files.pythonhosted.org/packages/a5/f5/397b61091120a9ca5001041dd7bf76c385b3bfd67a0e5bcb74b852bd22a4/evdev-1.9.3.tar.gz
        sha256: 2c140e01ac8437758fa23fe5c871397412461f42d421aa20241dc8fe8cfccbc9

  - name: desktopcat
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/desktopcat
      - cp -r desktopcat-src /app/share/desktopcat/desktopcat
      - install -Dm755 desktop-cat-launcher.sh /app/bin/desktop-cat
      - install -Dm644 io.github.gavvahar.DesktopCat.desktop
        /app/share/applications/io.github.gavvahar.DesktopCat.desktop
      - install -Dm644 desktop-cat.png
        /app/share/icons/hicolor/512x512/apps/io.github.gavvahar.DesktopCat.png
      - install -Dm644 io.github.gavvahar.DesktopCat.metainfo.xml
        /app/share/metainfo/io.github.gavvahar.DesktopCat.metainfo.xml
    sources:
      - type: dir
        path: ../../Python/desktopcat
        dest: desktopcat-src
      - type: file
        path: desktop-cat-launcher.sh
      - type: file
        path: io.github.gavvahar.DesktopCat.desktop
      - type: file
        path: ../appimage/desktop-cat.png
      - type: file
        path: io.github.gavvahar.DesktopCat.metainfo.xml
