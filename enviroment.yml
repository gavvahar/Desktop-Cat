name: cat
channels:
  - defaults
  - conda-forge

dependencies:
  - python
  - pip
  - gh
  # Runtime libs Qt's xcb platform plugin needs on a bare WSL2/minimal-Ubuntu
  # host (a full Ubuntu Desktop install ships these already) -- without
  # them PySide6 fails to load the xcb plugin at all. Installed here via
  # conda-forge instead of apt so `conda env create` is enough on its own.
  - xorg-libxcb
  - libxkbcommon
  - xcb-util-cursor
  - xcb-util-wm
  - xcb-util-keysyms
  - xorg-libsm
  - pip:
      - -r requirements.txt

# pynput hard-depends on evdev on Linux (its Wayland-fallback backend; this
# app only uses pynput's X11 backend, but pip still compiles evdev as a
# hard dependency). evdev's setup.py scans the host's real
# /usr/include/linux/*.h to decide which kernel input-event macros to
# reference in its C extension. conda's own cross-compiler toolchain
# (c-compiler + sysroot_linux-64) bundles its own much older copy of those
# same headers and silently substitutes it in at actual compile time via
# --sysroot, so the build ends up referencing macros (e.g. KEY_DICTATE,
# added in newer kernels) that don't exist in the headers it's actually
# compiling against -- and fails. The plain host gcc + the kernel headers
# that ship with it (apt's build-essential + linux-libc-dev) don't have
# this mismatch, since both steps then resolve to the same headers. Build
# this env with `CC=gcc conda env create -f enviroment.yml`.
