{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Desktop Cat{% endblock %}</title>
    <meta
      name="description"
      content="A free, open-source pixel-cat desktop companion. No telemetry -- sign in with Authentik SSO or a one-time purchase to download."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>"
    />
    <link rel="stylesheet" href="{% static 'downloads/css/style.css' %}" />
  </head>
  <body>
    {% if messages %}
      <ul class="auth-messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
    <script src="{% static 'downloads/js/main.js' %}"></script>
  </body>
</html>
