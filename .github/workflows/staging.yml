name: Staging Build

on:
  push:
    branches:
      - staging
    # Doc/dev-tooling-only pushes shouldn't trigger a build. The Flatpak
    # manifest is deliberately NOT excluded here even though it's .yml --
    # it changes what actually gets built/shipped, unlike these.
    paths-ignore:
      - "**.md"
      - "environment.yml"
      - ".github/workflows/*.yml"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml

  publish-staging:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/download-build-artifacts

      - name: Publish rolling staging pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag deliberately NOT "staging" -- that collides with the staging
          # *branch* name, which makes plain `git push`/`pull origin staging`
          # ambiguous ("refname 'staging' is ambiguous") or silently resolve
          # to the wrong ref entirely.
          gh release delete staging-latest --yes --cleanup-tag || true
          gh release create staging-latest \
            --prerelease \
            --target staging \
            --title "Staging build ($(git rev-parse --short HEAD))" \
            --notes "Automated staging build from commit $(git rev-parse HEAD). Not a versioned release -- for testing only." \
            dist-assets/Desktop-Cat-x86_64.AppImage \
            dist-assets/Desktop-Cat-windows.zip \
            dist-assets/Desktop-Cat-macos.zip \
            dist-assets/Desktop-Cat.flatpak
