name: Auto PR Description

on:
  pull_request:
    types: [opened, reopened]

jobs:
  generate-description:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gather PR context
        run: |
          git log "origin/${{ github.base_ref }}...HEAD" --format="%s" --no-merges > /tmp/commits.txt || true

          # Prefer the newest commit with a real conventional-commit type, since that
          # yields the most descriptive PR title. Without this, a generic subject line
          # (e.g. "Dev", "wip") that happens to be the newest commit would win just for
          # being newest, producing junk PR titles that flow straight into release notes.
          grep -iE "^(feat|fix|docs|refactor|perf|test)(\([^)]+\))?!?: " /tmp/commits.txt | head -1 \
            > /tmp/first_subject.txt || true

          # Fall back to the newest commit that isn't a maintenance-type prefix.
          [ -s /tmp/first_subject.txt ] || \
            grep -vE "^(chore|lint|style|ci|build)\b" /tmp/commits.txt | head -1 \
            > /tmp/first_subject.txt || true

          # Last resort: newest commit, whatever it says.
          [ -s /tmp/first_subject.txt ] || head -1 /tmp/commits.txt > /tmp/first_subject.txt || true

          git diff "origin/${{ github.base_ref }}...HEAD" --stat > /tmp/diff_stat.txt || true
          git diff "origin/${{ github.base_ref }}...HEAD" | head -c 51200 > /tmp/diff.txt || true

      - name: Assign PR author and code owners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import subprocess, os, fnmatch

          pr_author = "${{ github.event.pull_request.user.login }}"
          base_ref = "origin/${{ github.base_ref }}"

          changed = subprocess.run(
              ["git", "diff", f"{base_ref}...HEAD", "--name-only"],
              capture_output=True, text=True
          ).stdout.splitlines()

          def codeowners_match(pattern, filepath):
              p = pattern.lstrip("/")
              if p == "*":
                  return True
              if "/" not in p:
                  return fnmatch.fnmatch(os.path.basename(filepath), p)
              return fnmatch.fnmatch(filepath, p) or fnmatch.fnmatch(filepath, p.rstrip("/") + "/*")

          code_owners = set()
          for path in ["CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS"]:
              if os.path.exists(path):
                  rules = []
                  for line in open(path):
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split()
                      if len(parts) >= 2:
                          rules.append((parts[0], [o.lstrip("@") for o in parts[1:] if o.startswith("@")]))
                  for f in changed:
                      matched = []
                      for pattern, owners in rules:
                          if codeowners_match(pattern, f):
                              matched = owners
                      code_owners.update(matched)
                  break

          assignees = list(code_owners | {pr_author})
          for assignee in assignees:
              result = subprocess.run(
                  ["gh", "pr", "edit", "${{ github.event.pull_request.number }}",
                   "--add-assignee", assignee],
                  capture_output=True,
                  text=True,
              )
              if result.returncode == 0:
                  print(f"Assigned: {assignee}")
              elif "replaceActorsForAssignable" in result.stderr or "Assigning agents is not supported" in result.stderr:
                  print(f"Skipped {assignee} (bot/app accounts cannot be assigned)")
              else:
                  print(result.stderr[:200])
                  raise SystemExit(result.returncode)
          EOF

      - name: Apply labels
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import subprocess, re

          pr_number = "${{ github.event.pull_request.number }}"
          base_ref = "origin/${{ github.base_ref }}"

          changed = subprocess.run(
              ["git", "diff", f"{base_ref}...HEAD", "--name-only"],
              capture_output=True, text=True,
          ).stdout.splitlines()

          # Area labels from changed file paths
          area_labels = set()
          for f in changed:
              if f.startswith("Python/"):
                  area_labels.add("app")
              elif f.startswith("packaging/"):
                  area_labels.add("packaging")
              elif f.startswith("site/"):
                  area_labels.add("site")
              elif f.startswith(".github/"):
                  area_labels.add("ci")
              elif f in ("Dockerfile", "compose.yml", "environment.yml", "Makefile", "package.json", "package-lock.json") or f.endswith(".toml"):
                  area_labels.add("devops")

          # Type labels from conventional commit prefixes
          type_map = {
              "feat": "enhancement",
              "fix": "bug",
              "docs": "documentation",
              "chore": "chore",
              "refactor": "refactor",
              "perf": "performance",
          }
          type_labels = set()
          for line in open("/tmp/commits.txt").read().splitlines():
              m = re.match(r"^([a-z]+)(\([^)]+\))?[!]?:", line)
              if m and m.group(1) in type_map:
                  type_labels.add(type_map[m.group(1)])

          all_labels = area_labels | type_labels
          if not all_labels:
              print("No labels detected")
              raise SystemExit(0)

          # Ensure labels exist; create with standard colours if missing
          label_meta = {
              "app":           ("0e8a16", "The desktop pet app (Python/)"),
              "packaging":     ("5319e7", "AppImage / Flatpak / macOS / Windows packaging"),
              "site":          ("1d76db", "Django marketing/downloads/purchases site"),
              "devops":        ("d93f0b", "Docker / CI / infra"),
              "ci":            ("f9d0c4", "GitHub Actions"),
              "enhancement":   ("a2eeef", "New feature or request"),
              "bug":           ("d73a4a", "Something isn't working"),
              "documentation": ("0075ca", "Documentation improvements"),
              "chore":         ("cfd3d7", "Maintenance"),
              "refactor":      ("e4e669", "Code refactoring"),
              "performance":   ("fbca04", "Performance improvement"),
          }
          for label in all_labels:
              if label in label_meta:
                  color, desc = label_meta[label]
                  subprocess.run(
                      ["gh", "label", "create", label,
                       "--color", color, "--description", desc, "--force"],
                      capture_output=True,
                  )

          subprocess.run(
              ["gh", "pr", "edit", pr_number,
               "--add-label", ",".join(all_labels)],
              check=True,
          )
          print(f"Labels applied: {', '.join(sorted(all_labels))}")
          EOF

      # Method 1: git-cliff (Conventional Commits)
      - uses: ./.github/actions/setup-git-cliff

      - name: "[1] git-cliff"
        id: gitcliff
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git-cliff --config pyproject.toml "origin/${{ github.base_ref }}..HEAD" \
            > /tmp/pr_body.txt 2>/tmp/cliff_err.txt

          # pyproject.toml's git-cliff config has a catch-all parser (".*" -> "📝 Changes"),
          # so every commit lands in *some* group and "^### " always matches, even when none
          # of the commits actually used a conventional-commit prefix. Only treat this method
          # as successful when a *typed* category (not just the catch-all) is present, so
          # untyped commit histories fall through to the better title-generation fallbacks.
          grep "^### " /tmp/pr_body.txt | grep -qv "📝 Changes" \
            || { echo "No conventional commits found"; exit 1; }

          python3 - <<'EOF'
          import re, sys, os
          raw = open("/tmp/first_subject.txt").read().strip() or os.environ.get("HEAD_REF", "")
          clean = re.sub(r'^[a-z]+(\([^)]+\))?: ', '', raw)
          title = (clean[0].upper() + clean[1:])[:70] if clean else raw[:70]
          open("/tmp/pr_title.txt", "w").write(title)
          EOF

      # Method 2: Template from commit messages
      - name: "[2] Commit-message template"
        id: template
        if: steps.gitcliff.outcome == 'failure'
        continue-on-error: true
        run: |
          python3 .github/scripts/gen_template.py

      # Method 3: Nudge user toward GitHub Copilot
      - name: "[3] Suggest GitHub Copilot"
        if: steps.gitcliff.outcome == 'failure' && steps.template.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body \
            "All automatic description methods failed. If your repo has GitHub Copilot enabled, use the Generate description button in the PR editor, or fill it in manually."

      # Apply result
      - name: Update PR
        if: steps.gitcliff.outcome == 'success' || steps.template.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --title "$(tr -d '\n' < /tmp/pr_title.txt)" \
            --body-file /tmp/pr_body.txt
